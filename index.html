<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Гаражник — твой помощник в ТО Лады</title>
<meta name="description" content="Пошаговые инструкции по ТО Лады своими руками: замена масла, свечей, фильтров, колодок, антифриза. Точные объёмы и моменты затяжки под твою модель и двигатель, схемы, регламент ТО и личный гараж.">
<meta name="theme-color" content="#101316">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="canonical" href="https://garazhnik-lada.ru/">
<meta property="og:type" content="website">
<meta property="og:title" content="Гаражник — твой помощник в ТО Лады">
<meta property="og:description" content="Инструкции, схемы и точные цифры для ТО Лады в гараже.">
<meta property="og:image" content="https://garazhnik-lada.ru/og.png">
<meta property="og:url" content="https://garazhnik-lada.ru/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Russo+One&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: тёмный верстак с перфопанелью на фоне; шапка с выбором машины, сетка карточек-работ с иконками,
   в работе — «приборная панель» с цифрами для выбранной машины; на телефоне нижнее меню разделов.
   Гаражный стиль задуман тёмным в любой теме устройства. */
:root{
  color-scheme:dark;
  --bg:#0E1317; --peg:#1A222A; --surface:#161D24; --raised:#1D2630; --line:#29343F; --line-2:#36434F;
  --ink:#E7EDF2; --muted:#8C99A5; --dim:#5F6C78;
  --blue:#4F8FEA; --blue-ink:#9CC2F7; --blue-soft:#17263A;
  --amber:#F2B13A; --amber-ink:#0E1317; --amber-soft:#2E2412;
  --warn:#F07B63; --warn-soft:#33191440; --ok:#6CC48C;
  --f-display:"Russo One","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(var(--peg) 1.6px,transparent 1.8px);background-size:22px 22px;color:var(--ink);font:15px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--blue-ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* шапка */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head{display:flex;flex-direction:column;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:11px;background:var(--amber);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px;stroke:var(--amber-ink)}
.brand h1{font:24px/1 var(--f-display);margin:0;letter-spacing:.02em}
.brand .sub{color:var(--muted);font-size:13px;line-height:1.2}
.brand .t{display:flex;flex-direction:column;gap:3px;margin-right:auto}
.fam{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.fam::-webkit-scrollbar{display:none}
.fam button{flex:none;border:1px solid var(--line-2);background:var(--raised);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13.5px;white-space:nowrap;color:var(--muted);font-weight:500}
.fam button:hover{color:var(--ink)}
.fam button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;padding:6px 12px 9px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
nav.bottom{display:none}

main{padding-block:20px 56px}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--muted)}
.famnote{font-size:13px;color:var(--muted);margin:0 0 16px}
.famnote b{color:var(--amber);font-weight:600}

/* список работ */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;min-width:0;color:var(--ink)}
.card:hover{border-color:var(--line-2);background:var(--raised)}
.ico{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px;stroke:var(--blue-ink)}
.card h3{margin:2px 0 0;font-size:16.5px;font-weight:600;line-height:1.3;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.vid{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.lvl1{color:var(--ok)} .lvl2{color:var(--amber)}
.empty{color:var(--muted);padding:24px 0}

/* работа */
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--raised);color:var(--ink);border-radius:999px;cursor:pointer;padding:6px 14px 6px 10px;margin-bottom:16px;font-weight:500;font-size:14px}
.dhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.dhead .ico{width:54px;height:54px;border-radius:14px}
.dhead .ico svg{width:28px;height:28px}
.dhead > div{min-width:0}
.dmeta{margin-top:8px;padding-top:0}
.detail h2{font:26px/1.15 var(--f-display);margin:2px 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:65ch}
.plate{background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--line-2);border-radius:var(--r);padding:14px 16px;margin-bottom:24px}
.plate .cap{display:flex;align-items:center;gap:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:12px}
.plate .cap::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.plate dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 20px;margin:0}
.plate dt{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.plate dd{margin:0;font:500 17px/1.3 var(--f-mono);color:var(--amber);font-variant-numeric:tabular-nums}
.plate dd.txt{font:500 14px/1.45 var(--f-body);color:var(--ink)}
.plate .approx{font-size:12px;color:var(--dim);margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line)}
section.blk{margin-bottom:26px}
section.blk h4{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools button,.tools span{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--muted)}
.tools button{cursor:pointer;color:var(--blue-ink);border-color:color-mix(in srgb,var(--blue) 45%,transparent)}
.tools button:hover{background:var(--blue-soft)}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:0;max-width:70ch}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;position:relative;padding-bottom:14px}
ol.steps li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
ol.steps li::before{content:counter(s);font:14px/30px var(--f-display);text-align:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--amber);color:var(--amber);background:var(--bg);box-sizing:border-box;line-height:28px}
ol.steps li div{min-width:0;padding-top:4px}
.n{font:500 14px var(--f-mono);background:var(--amber-soft);color:var(--amber);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.warn{display:flex;gap:12px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink);border-radius:var(--r);padding:12px 16px;max-width:70ch}
.warn::before{content:"!";flex:none;width:22px;height:22px;border-radius:50%;background:var(--warn);color:var(--bg);font:14px/22px var(--f-display);text-align:center}
.warn p{margin:0}
.table{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
td:first-child{font-weight:600;min-width:180px}

/* видео */
.vids{display:flex;flex-direction:column;gap:8px}
.vid-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.vid-card:hover{border-color:var(--line-2)}
.vid-card a{flex:1;min-width:0;text-decoration:none;color:var(--ink);display:flex;flex-direction:column}
.vid-card a b{font-weight:600;overflow-wrap:anywhere}
.vid-card a small{color:var(--muted)}
.play{flex:none;width:40px;height:40px;border-radius:50%;background:var(--amber);display:grid;place-items:center}
.play::after{content:"";border-left:12px solid var(--amber-ink);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
.del{border:0;background:none;color:var(--warn);cursor:pointer;font-size:13px;padding:4px}
.nov{color:var(--muted);font-size:14px;margin:0}
form.add{display:grid;gap:10px;background:var(--surface);border:1px dashed var(--blue);border-radius:var(--r);padding:14px;margin-top:12px}
form.add .row{display:flex;gap:8px;flex-wrap:wrap}
form.add input,form.add select{padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 200px}
.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.msg{font-size:13px;margin:0;color:var(--muted)}
.msg.err{color:var(--warn)}
.owner-badge{font-size:12px;color:var(--amber);background:var(--amber-soft);padding:3px 10px;border-radius:999px}

/* инструмент и жидкости */
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;scroll-margin-top:190px}
.entry h3{margin:0 0 4px;font-size:18px;font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
.entry > p{margin:0 0 12px;color:var(--muted);max-width:68ch}
.types{display:grid;gap:0;margin:0;padding:0;list-style:none}
.types li{display:grid;grid-template-columns:minmax(130px,200px) 1fr;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.types li b{font-weight:600}
.types li span{min-width:0;color:var(--ink)}
.tip{display:flex;gap:10px;margin:12px 0 0;font-size:13.5px;color:var(--ink);background:var(--amber-soft);border-radius:10px;padding:10px 12px}
.tip::before{content:"Совет";flex:none;font:600 11px/1.9 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--amber)}
.stack{display:flex;flex-direction:column;gap:12px}
.tools button.part{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.tools button.part:hover{background:var(--amber-soft)}
.brands-cap{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 8px}
.brands{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.brands li{display:flex;flex-direction:column;gap:2px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.brands li b{font-weight:600}
.brands li span{font-size:12.5px;color:var(--muted)}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
.tier{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--surface)}
.tier.prem{border-top:3px solid var(--amber)}
.tier.eco{border-top:3px solid var(--ok)}
.tier-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 2px 8px}
.tier-h b{font:600 15px var(--f-head,var(--f-body));text-transform:uppercase;letter-spacing:.05em}
.tier.prem .tier-h b{color:var(--amber)} .tier.eco .tier-h b{color:var(--ok)}
.tier-h span{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.tier .brands{grid-template-columns:1fr}
.tier .brands li{border-radius:2px;background:var(--raised)}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.checks .chk{flex:none;width:18px;height:18px;margin-top:2px;border:2px solid var(--ok);border-radius:2px;position:relative}
.checks .chk::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
.checks li div{display:flex;flex-direction:column;gap:2px;min-width:0}
.checks li b{font-weight:600;font-size:14.5px}
.checks li div span{font-size:13.5px;color:var(--muted)}
@media (max-width:640px){.checks{gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}.checks li{border:0;border-radius:0;background:none;padding:10px 12px}.checks li+li{border-top:1px solid var(--line)}}
.checks-note{font-size:12.5px;color:var(--dim);margin:10px 0 0;max-width:75ch}
.tiernote{font-size:13.5px;color:var(--muted);margin:0 0 16px;max-width:75ch}
.tiernote b{color:var(--ink)}
.bad{margin-top:12px;font-size:13.5px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:10px;padding:10px 12px}
.bad b{color:var(--warn)}
.bad span{color:var(--muted)}

/* регламент, симптомы, гараж */
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:16px}
.feature,.logbtn{display:flex;align-items:center;gap:12px;text-align:left;background:linear-gradient(135deg,var(--amber-soft),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:var(--r);padding:14px;cursor:pointer;color:var(--ink);min-width:0;width:100%}
.feature .ico,.logbtn .ico{background:var(--amber);}
.feature .ico svg,.logbtn .ico svg{stroke:var(--amber-ink)}
.feature span:last-child,.logbtn span:last-child{display:flex;flex-direction:column;min-width:0}
.feature b,.logbtn b{font-size:16px}
.feature small,.logbtn small{color:var(--muted);font-size:13px}
.feature:hover,.logbtn:hover{border-color:var(--amber)}
.logbtn{margin-top:16px}
.approx-note{font-size:12.5px;color:var(--dim);margin:12px 0 0;max-width:70ch}
.linkbtn{border:0;background:none;color:var(--blue-ink);cursor:pointer;padding:9px 4px;margin:-7px 0;font-size:13.5px;font-weight:500;white-space:nowrap}
.linkbtn:hover{text-decoration:underline}
td:last-child{text-align:right}
.entry.starter{border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.sym h3{font-family:var(--f-body);font-weight:600;font-size:16.5px}
.sym.danger{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.dangerpill{display:inline-block;margin:2px 0 6px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border-color:transparent}
.causes{margin:6px 0 12px;padding-left:20px;color:var(--ink);display:flex;flex-direction:column;gap:4px;max-width:68ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips button{border:1px solid var(--line-2);background:var(--raised);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.chips button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:600}
.carcard{background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--line-2);border-radius:var(--r);padding:16px;margin-bottom:24px;display:flex;flex-direction:column;gap:14px}
.carhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.carhead h3{margin:0;font:22px/1.15 var(--f-display);font-weight:400}
.carhead p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.carbtns{display:flex;gap:6px;align-items:flex-start}
.kmrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.kmrow .cap{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.bigkm{font:500 28px/1.2 var(--f-mono);color:var(--amber);font-variant-numeric:tabular-nums}
.kmset{display:flex;gap:8px;min-width:0;flex:0 1 300px}
.kmset input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);color:var(--ink)}
.ghost{border:1px solid var(--line-2);background:transparent;color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500}
.ghost.sm{padding:5px 10px;font-size:13px}
.ghost.danger{color:var(--warn)}
.duelist,.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.due{display:flex;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:10px;padding:10px 14px}
.due-main{display:flex;flex-direction:column;min-width:0}
.due-main small{color:var(--muted);font-size:12.5px}
.due-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.stpill{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-over{border-left-color:var(--warn)} .st-over .stpill{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st-soon{border-left-color:var(--amber)} .st-soon .stpill{background:var(--amber-soft);color:var(--amber)}
.st-ok{border-left-color:var(--ok)} .st-ok .stpill{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.st-none .stpill{background:var(--raised);color:var(--muted)}
.gform{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.gform h3{margin:0;font-size:17px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 12px}
.gform label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.gform label.wide{grid-column:1/-1}
.gform input,.gform select{padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;min-width:0;width:100%}

/* ---------- схемы к шагам: рисунок + подпись под ним ---------- */
const sv = (body, label) => `<svg viewBox="0 0 260 130" class="stepsvg" role="img" aria-label="${label}">${body}</svg>`;
function head(x, y, ang, cls = "fx-headA"){ const a = ang * Math.PI / 180, s = 9;
  const p = (dx, dy) => `${(x + dx*Math.cos(a) - dy*Math.sin(a)).toFixed(1)} ${(y + dx*Math.sin(a) + dy*Math.cos(a)).toFixed(1)}`;
  return `<path d="M${p(0,0)} L${p(-s,-s*0.6)} L${p(-s,s*0.6)} Z" class="${cls}"/>`; }
function arr(x1,y1,x2,y2,cls="fx-arA"){ const ang = Math.atan2(y2-y1, x2-x1)*180/Math.PI; return `<path d="M${x1} ${y1} L${x2} ${y2}" class="${cls}"/>${head(x2,y2,ang, cls === "fx-arA" ? "fx-headA" : "fx-headM")}`; }
function arc(cx,cy,r,a0,a1,cls="fx-arA"){
  const P = a => [cx + r*Math.cos(a*Math.PI/180), cy + r*Math.sin(a*Math.PI/180)];
  const [x0,y0] = P(a0), [x1,y1] = P(a1), large = Math.abs(a1-a0) > 180 ? 1 : 0, sw = a1 > a0 ? 1 : 0;
  const tang = a1 > a0 ? a1 + 90 : a1 - 90;
  return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} ${sw} ${x1.toFixed(1)} ${y1.toFixed(1)}" class="${cls}"/>${head(x1,y1,tang, cls === "fx-arA" ? "fx-headA" : "fx-headM")}`; }
const t = (x,y,s,cls="fx-s",anc="middle") => `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anc}">${s}</text>`;
const hexBolt = (x,y,r=9,cls="fx-boltM") => `<path d="${Array.from({length:6},(_,i)=>{const a=(60*i+30)*Math.PI/180;return (i?"L":"M")+(x+r*Math.cos(a)).toFixed(1)+" "+(y+r*Math.sin(a)).toFixed(1);}).join(" ")}Z" class="${cls}"/>`;
const bucket = (x,y,w=60,h=30) => `<path d="M${x} ${y} L${x+6} ${y+h} H${x+w-6} L${x+w} ${y}" class="fx-bucket"/>`;
const drops = (x,y,n=2) => Array.from({length:n},(_,i)=>`<circle cx="${x}" cy="${y+i*10}" r="${3-i*0.4}" class="fx-oilf"/>`).join("");
const resv = (x,y,w,h,level,cls="fx-brakefl") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" class="fx-glassbox"/><rect x="${x+1}" y="${y+level}" width="${w-2}" height="${h-level-1}" rx="7" class="${cls}"/><path d="M${x+w} ${y+h*0.25} H${x+w+12} M${x+w} ${y+h*0.65} H${x+w+12}" class="fx-mark"/>${t(x+w+16,y+h*0.25+4,"MAX","fx-v2","start")}${t(x+w+16,y+h*0.65+4,"MIN","fx-v2","start")}`;

const fill = s => { const f = F(); return esc(s).replace(/\{(\w+)\}/g, (m,k) => f[k] ? `<span class="n">${esc(f[k])}</span>` : m); };
const stepOk = st => { if(typeof st === "string") return true; const e = engOf(fam), f = F();
  return (!st.only || st.only.includes(fam)) && (!st.not || !st.not.includes(fam)) && (!st.kind || st.kind === (e?.kind || "inj")) && (!st.tank || (st.tank === "yes") === !!f.tankFilter); };

const km = n => Number(n).toLocaleString("ru-RU") + " км";
const rub = n => Number(n).toLocaleString("ru-RU") + " ₽";
const isoToday = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const ruDate = iso => iso ? iso.split("-").reverse().join(".") : "";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const setFam = k => { if(!FAM[k]) return; fam = k; try{ localStorage.setItem("garazh-fam", fam); }catch(_){} };

function platform(url){
  try{
    const h = new URL(url).hostname.replace(/^www\.|^m\./,"");
    if(/(^|\.)youtube\.com$|^youtu\.be$/.test(h)) return "YouTube";
    if(/rutube\.ru$/.test(h)) return "Rutube";
    if(/^vk\.com$|vkvideo\.ru$|^vk\.ru$/.test(h)) return "VK Видео";
    return h;
  }catch(e){ return null; }
}

/* ---------- отрисовка ---------- */
function renderFam(){
  const f = F();
  const e = engOf(fam);
  $("#famCur").innerHTML = `<b>${esc(f.name)}</b><small>${esc(e ? e.name : f.models)}</small>`;
  const engs = ENG[fam] || [], kind = e ? e.kind : "inj";
  const hasCarb = engs.some(x => x.kind === "carb"), hasInj = engs.some(x => x.kind === "inj");
  const ofKind = engs.filter(x => x.kind === kind);
  const short = x => x.name.replace(/^(Карбюратор|Инжектор)\s*/i, "") || "Стандартный";
  $("#famMenu").innerHTML =
    `<div class="mstep"><div class="mcap"><span>1</span>Машина</div><div class="mfams">` + Object.entries(FAM).map(([k,x]) =>
      `<button type="button" data-fam="${k}" aria-pressed="${k===fam}"><b>${esc(x.name)}</b><small>${esc(x.models)}</small></button>`).join("") + `</div></div>` +
    `<div class="mstep"><div class="mcap"><span>2</span>Питание</div><div class="mseg">` +
      `<button type="button" data-kind="carb" aria-pressed="${kind==="carb"}" ${hasCarb ? "" : "disabled"}>Карбюратор</button>` +
      `<button type="button" data-kind="inj" aria-pressed="${kind==="inj"}" ${hasInj ? "" : "disabled"}>Инжектор</button></div>` +
      (hasCarb ? "" : `<p class="mnote">У ${esc(f.name)} только инжектор.</p>`) + `</div>` +
    `<div class="mstep"><div class="mcap"><span>3</span>Двигатель</div><div class="engs">` + ofKind.map(x =>
      `<button type="button" data-eng="${x.id}" aria-pressed="${e && x.id===e.id}"><b>${esc(short(x))}</b><small>${esc(x.sub)}</small></button>`).join("") + `</div></div>` +
    `<div class="mdone"><button type="button" class="btn" data-famclose>Готово</button></div>` +
    (hasCarb ? `<details class="enghelp"><summary>Как понять: карбюратор или инжектор?</summary><ul>
      <li><b>Карбюратор:</b> в салоне есть ручка подсоса (обычно слева под рулём), сверху мотора большой круглый корпус воздушного фильтра.</li>
      <li><b>Инжектор:</b> ручки подсоса нет, при включении зажигания на панели загорается лампа «Check Engine», корпус фильтра сбоку, от него гофра к дроссельному узлу.</li>
      <li>Точно — по номеру двигателя в ПТС.</li></ul></details>` : "");
}

function dueList(car){
  const now = new Date(isoToday());
  return SCHED.filter(s => !(s.skip && s.skip(car.fam))).map(s => {
    const last = garage.log.filter(l => l.car === car.id && l.type === s.id).sort((a,b) => (b.km - a.km) || (b.date > a.date ? 1 : -1))[0];
    const iv = val(s.km, car.fam), yrs = val(s.years, car.fam);
    let status = "none", left = null, dueDate = null;
    if(last){
      status = "ok";
      if(iv){ left = last.km + iv - car.mileage; if(left <= 0) status = "over"; else if(left <= 2000) status = "soon"; }
      if(yrs && last.date){ const d = new Date(last.date); d.setFullYear(d.getFullYear() + yrs); dueDate = d;
        const days = (d - now) / 864e5; if(days <= 0) status = "over"; else if(days <= 30 && status === "ok") status = "soon"; }
    }
    return {s, last, iv, left, dueDate, status};
  }).sort((a,b) => ({over:0,soon:1,none:2,ok:3}[a.status] - {over:0,soon:1,none:2,ok:3}[b.status]));
}
const STATUS = {over:["Пора делать","st-over"],soon:["Скоро","st-soon"],ok:["В норме","st-ok"],none:["Нет записей","st-none"]};

const TABS = ["to","garage","tools","parts"];
function go(hash){ if(location.hash.slice(1) !== hash) location.hash = hash; else route(); }
function route(){
  const h = location.hash.slice(1);
  openJob = null; view = "list";
  if(JOBS.some(j => j.id === h)){ openJob = h; tab = "to"; }
  else if(h === "schedule" || h === "symptoms" || h === "numbers" || h === "about"){ view = h; tab = "to"; }
  else if(h === "fluids") tab = "parts";
  else if(TABS.includes(h)) tab = h;

}

function arm(b, label, fn){

    setTimeout(() => { if(b.isConnected){ b.dataset.armed = ""; b.textContent = old; } }, 4000); return; }
  fn();
}

/* ---------- режим «Делаю сейчас» ---------- */
let doer = null, wake = null;
async function keepAwake(){ try{ if(navigator.wakeLock && doer) wake = await navigator.wakeLock.request("screen"); }catch(e){ wake = null; } }
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && doer) keepAwake(); });
function startDoer(id){
  const j = JOBS.find(x => x.id === id); if(!j) return;
  doer = {j, steps: j.steps.map((s,i) => [s,i]).filter(([s]) => stepOk(s)), cur: 0};
  document.body.classList.add("locked"); keepAwake(); renderDoer();
}
function closeDoer(){ doer = null; $("#doer").hidden = true; document.body.classList.remove("locked"); try{ wake && wake.release(); }catch(e){} wake = null; }
function renderDoer(){
  const el = $("#doer"); if(!doer){ el.hidden = true; return; }
  const {j, steps, cur} = doer, n = steps.length, f = F();
  const done = cur >= n;
  const nums = j.plate.length ? `<details class="dnums"><summary>Цифры для ${esc(f.name)}</summary><dl>${j.plate.map(k => `<div><dt>${PLATE_LABEL[k]}</dt><dd>${esc(f[k])}</dd></div>`).join("")}</dl></details>` : "";
  const body = done
    ? `<div class="dfinish"><div class="dcheck" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div><h3>Работа сделана</h3><p>${esc(j.title)}</p>
        ${JOB_LOG[j.id] ? `<button type="button" class="btn big" data-dlog="${JOB_LOG[j.id]}">Записать в «Мой гараж»</button>` : ""}
        <button type="button" class="ghost big" data-dclose>Закрыть</button></div>`
    : `<div class="dstep"><div class="dnum">${cur + 1}</div><p class="dtext">${fill(steps[cur][0].t || steps[cur][0])}</p>${stepFig(j.id, steps[cur][1])}${photoStrip(j.id, String(steps[cur][1]), "", true)}</div>`;
  el.innerHTML = `<div class="dtop"><button type="button" class="dx" data-dclose aria-label="Закрыть">×</button>
      <div class="dtitle"><b>${esc(j.title)}</b><small>${done ? "Готово" : `Шаг ${cur + 1} из ${n}`}</small></div></div>
    <div class="dbar"><span style="width:${Math.round(Math.min(cur, n) / n * 100)}%"></span></div>
    <div class="dbody">${nums}${body}</div>
    ${done ? "" : `<div class="dnav"><button type="button" class="ghost big" data-dprev ${cur === 0 ? "disabled" : ""}>Назад</button><button type="button" class="btn big amber" data-dnext>${cur === n - 1 ? "Готово" : "Сделал, дальше"}</button></div>`}`;
  el.hidden = false;
  el.querySelector(".dbody").scrollTop = 0;
}
document.addEventListener("keydown", e => {
  if(!doer) return;
  if(e.target.tagName === "INPUT") return;
  if(e.key === "Escape") closeDoer();
  else if(e.key === "ArrowRight" || e.key === "Enter"){ if(doer.cur < doer.steps.length){ doer.cur++; renderDoer(); } }
  else if(e.key === "ArrowLeft"){ if(doer.cur > 0){ doer.cur--; renderDoer(); } }
});

const photosFor = (target, slot) => photos.filter(p => p.target === target && String(p.slot) === String(slot));

  const col = (slot, list, i, add) => {
    const scheme = sf && !list.length ? `<figure class="minifig">${sf[i]}<figcaption>${esc(sc[i])}</figcaption></figure>` : "";
    return scheme + (photoStrip(target, slot, add) || (scheme ? "" : `<p class="nov">Фото пока нет</p>`));
  };
  return `<div class="pair"><div class="pair-col"><div class="pair-h prob">Проблема</div>${col("problem", pr, 0, "+ Фото проблемы")}</div>
    <div class="pair-arrow" aria-hidden="true">→</div>
    <div class="pair-col"><div class="pair-h sol">Решение</div>${col("solution", so, 1, "+ Фото решения")}</div></div>`;
}
function softRender(){
  const a = document.activeElement;
  if(a && a.closest && a.closest("#main") && a.id !== "q" && (a.tagName === "INPUT" || a.tagName === "SELECT" || a.tagName === "TEXTAREA")) return;
  if(doer){ renderDoer(); return; }
  if(openJob || view === "symptoms"){ const y = scrollY; render(); scrollTo(0, y); }
}
async function shrink(file){
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85));
  }catch(e){ return file; }
}
function toast(t, err){ const el = $("#toast"); el.textContent = t; el.className = "toast show" + (err ? " err" : ""); clearTimeout(toast.t); toast.t = setTimeout(() => el.className = "toast", 3500); }
async function uploadPhotos(files){
  if(!assets || !db || !photoTarget) return;
  const [target, slot] = photoTarget.split("|");
  for(const f of files){
    if(!/^image\//.test(f.type)){ toast("Это не картинка. Выбери фото в формате JPG, PNG или WebP.", true); continue; }
    toast("Загружаю фото…");
    try{
      const blob = await shrink(f);
      const r = await assets.upload(blob, {type: blob.type && /^image\/(jpeg|png|webp|gif)$/.test(blob.type) ? blob.type : "image/jpeg"});
      await db.collection("photos").add({target, slot, assetId: r.id, caption: "", createdAt: Date.now()});
      toast("Фото добавлено.");
    }catch(err){
      const c = err && err.code;
      toast(c === "too_large" ? "Фото слишком большое, максимум 20 МБ." : c === "quota_or_state" ? "Место для файлов закончилось. Удали ненужные фото." : "Не удалось загрузить фото. Попробуй ещё раз.", true);
    }
  }
}
async function delPhoto(id){
  const p = photos.find(x => x.id === id); if(!p) return;
  try{ await db.doc("photos/" + id).delete(); if(assets) await assets.delete(p.assetId).catch(() => {}); toast("Фото удалено."); }
  catch(e){ toast("Не удалось удалить фото.", true); }
}
document.addEventListener("change", async e => {
  if(e.target.id === "photoInput"){ const files = [...e.target.files]; e.target.value = ""; await uploadPhotos(files); }
  else if(e.target.dataset.capfor){ try{ await db.doc("photos/" + e.target.dataset.capfor).update({caption: e.target.value.trim().slice(0,120)}); toast("Подпись сохранена."); }catch(_){ toast("Не удалось сохранить подпись.", true); } }
});
function openLightbox(id){
  const p = photos.find(x => x.id === id); if(!p) return;
  const lb = $("#lightbox"); lb.querySelector("img").src = photoSrc(p); lb.querySelector("img").alt = p.caption || "Фото";
  lb.querySelector("p").textContent = p.caption || ""; lb.hidden = false; lb.querySelector("button").focus();
}
function closeLightbox(){ $("#lightbox").hidden = true; }
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#lightbox").hidden) closeLightbox(); });

/* ---------- видео: хранилище ---------- */
async function addVideo(form){
  const msg = form.querySelector("[data-vmsg]"); const url = form.elements.url.value.trim(); const title = form.elements.title.value.trim();
  const p = platform(url);
  if(!p || !/^https:\/\//.test(url)){ msg.className = "msg err"; msg.textContent = "Ссылка должна начинаться с https://. Скопируй её из адресной строки или кнопки «Поделиться»."; return; }
  msg.className = "msg"; msg.textContent = "Сохраняю…";
  try{
    await db.collection("videos").add({instr: form.dataset.job, url, title: title || ("Видео с " + p), family: form.elements.fam.value, createdAt: Date.now()});
    form.elements.url.value = ""; form.elements.title.value = "";
    msg.textContent = "Добавлено.";
  }catch(err){
    msg.className = "msg err";
    msg.textContent = err && err.code === "quota_exceeded" ? "Хранилище заполнено, удали старые видео." : "Не удалось сохранить. Проверь подключение и попробуй ещё раз.";
  }
}
async function delVideo(b){
  arm(b, "Точно удалить?", async () => {
    b.disabled = true;
    try{ await db.doc("videos/" + b.dataset.del).delete(); }catch(err){ b.disabled = false; b.textContent = "Не удалось удалить"; }
  });
}

async function initStore(){
  const local = loadLocal(); if(local){ garage = local; try{ const a = localStorage.getItem("garazh-car"); if(a) activeCar = a; }catch(e){} }
  if(!window.claude?.use){
    try{ const [v, ph] = await Promise.all([fetch("videos.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : []).catch(() => []), fetch("photos.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : []).catch(() => [])]);
      videos = (Array.isArray(v) ? v : []).filter(x => x && x.url && x.instr).map((x,i) => ({id: "v" + i, family: "all", ...x}));
      photos = (Array.isArray(ph) ? ph : []).filter(x => x && x.file && x.target).map((x,i) => ({id: "p" + i, ...x}));
    }catch(e){}
    dbReady = true; const y = scrollY; render(); scrollTo(0, y); return; }
  try{
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    isOwner = u ? await u.isOwner() : false;
    $("#ownerBadge").hidden = !isOwner;
    db = d;
    if(isOwner){ try{ assets = await claude.use("assets"); }catch(_){ assets = null; } }
    await initGarage(u);
    if(tab === "garage" && !gEditing) render();
    if(!db){ dbReady = true; rerenderVideos(); return; }
    db.collection("photos").orderBy("createdAt").onSnapshot(snap => {
      photos = snap.docs.map(d => ({id: d.id, ...d.data()}));
      softRender();
    }, () => {});
    db.collection("videos").orderBy("createdAt").onSnapshot(snap => {
      videos = snap.docs.map(d => ({id: d.id, ...d.data()}));
      dbReady = true; rerenderVideos();
    }, () => { dbReady = true; rerenderVideos(); });
  }catch(e){ dbReady = true; rerenderVideos(); }
}

route();
initStore();
(function(){ let seen = false; try{ seen = localStorage.getItem("garazh-cookie") === "1"; }catch(e){}
  const bar = document.getElementById("cookiebar"); if(!seen) bar.hidden = false;
  document.getElementById("cookieOk").addEventListener("click", () => { bar.hidden = true; try{ localStorage.setItem("garazh-cookie", "1"); }catch(e){} }); })();
if("serviceWorker" in navigator && location.protocol === "https:"){ window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
